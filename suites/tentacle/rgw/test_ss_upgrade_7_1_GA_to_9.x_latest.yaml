# Objective: P0 singlesite SSL upgrade from RHCS 7.1z(GA) to 9.x latest.
# Cluster: EC 2+2 @4 nodes + SSL + haproxy + min 3 RGW daemons (ss + ssl)
# platform: RHEL-9
# global-conf: conf/tentacle/rgw/ec-profile-2+2@4nodes.yaml

tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                rhcs-version: 7.1
                release: released
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: true
              base_cmd_args:
                verbose: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                - "crush-failure-domain=host crush-device-class=hdd"
              command: shell
          - config:
              args:
                - "ceph osd pool create primary.rgw.buckets.data 32 32"
                - "erasure rgwec22_4"
              command: shell
          - config:
              args:
                - "ceph osd pool application enable"
                - "primary.rgw.buckets.data rgw"
              command: shell
          - config:
              command: apply_spec
              service: orch
              specs:
                - service_type: rgw
                  service_id: shared.pri
                  placement:
                    nodes:
                      - node2
                      - node3
                      - node4
                  spec:
                    ssl: true
                    rgw_frontend_ssl_certificate: create-cert
                    rgw_frontend_extra_args:
                      - "port=80"
      desc: bootstrap and deployment services with label placements.
      polarion-id: CEPH-83573777
      destroy-cluster: false
      module: test_cephadm.py
      name: Deploy RHCS cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        cephadm: true
        commands:
          - "sleep 120"
          - "radosgw-admin realm create --rgw-realm india --default"
          - "radosgw-admin zonegroup create --rgw-realm india --rgw-zonegroup shared --endpoints https://{node_ip:node2},https://{node_ip:node3},https://{node_ip:node4} --master --default"
          - "radosgw-admin zone create --rgw-realm india --rgw-zonegroup shared --rgw-zone primary --endpoints https://{node_ip:node2},https://{node_ip:node3},https://{node_ip:node4} --master --default"
          - "radosgw-admin period update --rgw-realm india --commit"
          - "ceph config set client.rgw.{daemon_id:shared.pri} rgw_realm india"
          - "ceph config set client.rgw.{daemon_id:shared.pri} rgw_zonegroup shared"
          - "ceph config set client.rgw.{daemon_id:shared.pri} rgw_zone primary"
          - "ceph config set client.rgw.{daemon_id:shared.pri} rgw_verify_ssl False"
          - "ceph orch restart {service_name:shared.pri}"
      desc: Setting single zone environment
      module: exec.py
      name: Setting single zone environment
      polarion-id: CEPH-10362

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Configure the RGW client system
      destroy-cluster: false
      module: test_client.py
      name: configure client
      polarion-id: CEPH-83573758

  - test:
      abort-on-fail: true
      clusters:
        ceph:
          config:
            haproxy_clients:
              - node4
            rgw_endpoints:
              - node2:80
              - node3:80
              - node4:80
      desc: "Configure HAproxy"
      module: haproxy.py
      name: "Configure HAproxy"

  - test:
      abort-on-fail: true
      config:
        cephadm: true
        commands:
          - "radosgw-admin period get"
      desc: Get period pre upgrade
      module: exec.py
      name: Get period pre upgrade
      polarion-id: CEPH-10362

  - test:
      name: Mbuckets_with_Nobjects with etag verification pre upgrade
      desc: test etag verification
      module: sanity_rgw.py
      polarion-id: CEPH-83574871
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_etag.yaml
        run-on-haproxy: true

  - test:
      name: Upgrade cluster to latest ceph version
      desc: Upgrade cluster to latest version
      module: test_cephadm_upgrade.py
      polarion-id: CEPH-83573791
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true
        verify_cluster_health: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      desc: Retrieve the versions of the cluster
      module: exec.py
      name: post upgrade gather version
      polarion-id: CEPH-83575200
      config:
        cephadm: true
        commands:
          - "ceph versions"

  - test:
      abort-on-fail: true
      config:
        cephadm: true
        commands:
          - "radosgw-admin period get"
      desc: Get period post upgrade
      module: exec.py
      name: Get period post upgrade
      polarion-id: CEPH-10362

  - test:
      name: Mbuckets_with_Nobjects with etag verification post upgrade
      desc: test etag verification
      module: sanity_rgw.py
      polarion-id: CEPH-83574871
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_etag.yaml
        run-on-haproxy: true
