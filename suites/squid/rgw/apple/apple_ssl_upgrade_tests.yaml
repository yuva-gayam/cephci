# Reusable upgrade tests: 8.1z3 → 9.1 hotfix.
# Insert after RGW deploy on 8.1z3 (and optional pre-upgrade baseline).
# Bootstrap: rhcs-version: 8.1, release: z3
#
# Copy both tests below into Apple SSL suites.

tests:
  - test:
      abort-on-fail: true
      name: upgrade 8.1z3 to hotfix
      desc: Upgrade cluster from 8.1z3 to 9.1 hotfix.
      module: test_cephadm_upgrade.py
      verify_cluster_health: true
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true

  - test:
      name: verify upgrade to hotfix completed
      module: exec.py
      desc: Confirm orch upgrade finished and cluster is healthy on hotfix.
      config:
        cephadm: true
        commands:
          - ceph -v
          - ceph orch upgrade status
          - ceph -s
